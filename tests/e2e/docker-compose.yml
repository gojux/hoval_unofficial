services:
  modbus-sim:
    build: ./modbus-sim
    ports:
      - "${MODBUS_SIM_PORT:-15020}:502"

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.11.1
    ports:
      - "${HA_PORT:-8123}:8123"
    volumes:
      - ../../custom_components:/config/custom_components:ro
      - ./ha-config/configuration.yaml:/config/configuration.yaml:ro
    depends_on:
      - modbus-sim
